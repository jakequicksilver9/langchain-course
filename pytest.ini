; Pytest config lives here rather than in pyproject.toml on purpose.
;
; Every course project branch ships its own pyproject.toml, and the branches have
; unrelated histories - there is no merge base between main and project/*. Keeping
; this out of pyproject.toml means the whole harness is additive files only, so
; `git cherry-pick` lands it on any project branch without a single conflict.
;
; Coming from JUnit: addopts is the equivalent of surefire config in the POM -
; flags applied to every run, so plain `pytest` enforces the gate locally and in CI.

[pytest]
testpaths = tests

; Course projects are flat scripts at the repo root (main.py, ingestion.py) with no
; installed package, so the root has to be on sys.path for `import main` to work
; from tests/. Without this, every test that imports course code fails with
; ModuleNotFoundError. Roughly what the test classpath gives you for free in Maven.
pythonpath = .

; pytest-asyncio: `auto` means async test functions run without an explicit
; @pytest.mark.asyncio on each one.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    --cov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=90

; `--cov` with no argument takes its source from .coveragerc, which keeps the
; measured paths in one place instead of repeating them here.
