# SonarQube Cloud config for the CI scan action.
#
# The local `sonar` CLI (v1.x) uses a different file - .sonar-config.json, which
# `sonar link` generates once you are authenticated. The two coexist: this file
# drives CI, .sonar-config.json drives the local CLI.
#
# Verify the key against what the UI shows after importing the repo; SonarQube
# Cloud derives it from the GitHub org and repo name.
sonar.projectKey=jakequicksilver9_langchain-course
sonar.organization=jakequicksilver9

# Course projects are flat scripts at the repo root, not a src/ layout.
sonar.sources=.
sonar.tests=tests

# A path cannot be both source and test, so tests must be excluded from sources.
sonar.exclusions=tests/**,.venv/**,static/**

# Sonar never generates coverage itself, in any language - pytest-cov writes
# coverage.xml and Sonar reads it. Same arrangement as JaCoCo for Java.
sonar.python.coverage.reportPaths=coverage.xml
